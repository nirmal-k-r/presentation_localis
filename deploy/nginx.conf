# /etc/nginx/sites-available/pymug  ->  ln -s into sites-enabled, then: nginx -t && systemctl reload nginx
# HTTPS: sudo certbot --nginx -d slides.example.com
server {
    listen 80;
    server_name slides.example.com;

    location / {
        proxy_pass http://127.0.0.1:3022;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # live stream for the phone remote; must not be buffered
    location /events {
        proxy_pass http://127.0.0.1:3022;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
